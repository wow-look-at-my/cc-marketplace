name: Release Plugins

on:
  push:

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # setup-marketplace-build runs go-toolchain on a cache miss, so every job
    # using it needs go-toolchain's full permission set (see that action's own
    # notes). A composite cannot request permissions, and the miss only happens
    # when tools/marketplace-build changes -- which is why an incomplete set
    # here stayed green until the day someone edited the tool.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    outputs:
      all_plugins: ${{ steps.matrix.outputs.plugins }}
      build_plugins: ${{ steps.split.outputs.build_plugins }}
      cached_plugins: ${{ steps.split.outputs.cached_plugins }}
      has_build: ${{ steps.split.outputs.has_build }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-marketplace-build

      - id: matrix
        run: marketplace-build prepare-matrix >> $GITHUB_OUTPUT

      - name: Check plugin caches
        id: split
        if: steps.matrix.outputs.has_changes == 'true'
        uses: wow-look-at-my/actions@typescript#latest
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ github.workspace }}/node_modules
          CACHE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || format('refs/heads/{0}', github.ref_name) }}
        with:
          steps: ${{ toJSON(steps) }}
          script: |
            const { hashFiles } = require('@actions/glob');
            const plugins: string[] = JSON.parse(steps.matrix.outputs.plugins);
            const repo = process.env.GITHUB_REPOSITORY;
            const ref = process.env.CACHE_REF;

            const buildPlugins: string[] = [];
            const cachedPlugins: string[] = [];
            const toolHash = await hashFiles('tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod');

            for (const plugin of plugins) {
              const hash = await hashFiles(`plugins/${plugin}/**`);
              const key = `plugin-${plugin}-${hash}-${toolHash}`;

              let cached = false;
              try {
                const out = child_process.execSync(
                  `gh api "repos/${repo}/actions/caches?key=${encodeURIComponent(key)}&ref=${encodeURIComponent(ref!)}" --jq ".actions_caches | length"`,
                  { encoding: 'utf8' },
                ).trim();
                cached = parseInt(out, 10) > 0;
              } catch {
                cached = false;
              }

              if (cached) {
                cachedPlugins.push(plugin);
                core.info(`${plugin}: cached`);
              } else {
                buildPlugins.push(plugin);
                core.info(`${plugin}: needs build`);
              }
            }

            core.setOutput('build_plugins', JSON.stringify(buildPlugins));
            core.setOutput('cached_plugins', JSON.stringify(cachedPlugins));
            core.setOutput('has_build', String(buildPlugins.length > 0));


  build:
    needs: prepare
    if: needs.prepare.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      # go-toolchain submits the module graph to GitHub's dependency graph,
      # which the API gates behind contents: write. Its no-all-builds guard
      # scans the run's jobs and the head commit's check runs, and fails closed
      # without the two read grants.
      contents: write
      actions: read
      checks: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.build_plugins) }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute plugin hash
        id: hash
        run: echo "value=${{ hashFiles(format('plugins/{0}/**', matrix.plugin), 'tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod') }}" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/setup-marketplace-build

      # One fat APE, not the os x arch matrix: a plugin ships exactly one binary
      # now, and release-plugin FAILS CLOSED on a build/ holding per-platform
      # binaries instead (ape_package.go) rather than shipping a package that
      # works on some platforms and silently not others.
      #
      # @v1, not @latest: `latest` is a frozen orphan tag from 2026-05 that
      # predates the `targets` input, and an unknown `with:` key is a WARNING,
      # not an error -- so `targets: cosmo` was silently dropped and the default
      # matrix ran. v1 is the ref the org documents and every other repo uses.
      - name: Build Go plugin
        if: ${{ hashFiles(format('plugins/{0}/**/*.go', matrix.plugin)) != '' }}
        uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: plugins/${{ matrix.plugin }}
          targets: cosmo
          upload-artifacts: 'false'
          # A plugin is distributed as an orphan tag, never a buildhost release, so
          # nothing here should publish. autorelease defaults TRUE and fires on
          # every branch push -- and its GitHub Deployment + storage record are
          # hard failures without deployments/artifact-metadata write.
          autorelease: 'false'

      - name: Build
        run: npx tsx .github/scripts/build-plugin.ts ${{ matrix.plugin }}

      - name: Test
        run: npx tsx .github/scripts/test-plugin.ts ${{ matrix.plugin }}

      - name: Cook plugin
        id: release
        run: marketplace-build release-plugin ${{ matrix.plugin }} >> $GITHUB_OUTPUT

      - uses: ./.github/actions/setup-claude-code

      - name: Validate Plugin
        run: claude plugin validate ${{ steps.release.outputs.source_dir }}

      # The cooked directory IS the artifact now: publishing is an orphan tag
      # holding exactly this tree, which `claude plugin install` shallow-clones.
      # The version comes from release-plugin rather than the action's own
      # auto-increment, because the manifest inside this tree already records
      # the tag and marketplace.json pins it -- the two must agree.
      #
      # This step is retried up to 3 times. Version numbers come from
      # GITHUB_RUN_NUMBER, which GitHub guarantees unique per run -- so two
      # concurrent runs never compute the same version, and there is never a
      # real content conflict to resolve. What DOES happen under concurrency:
      # orphan-release.sh force-pushes `#latest` and the version tag together
      # in one atomic push, and even a forced push carries the old-SHA the
      # client observed at handshake time -- if another run moves `#latest`
      # in the narrow window between our handshake and our push, GitHub's
      # atomic ref-transaction rejects the WHOLE push ("cannot lock ref"),
      # taking the (uncontested, uniquely-numbered) version tag down with it.
      # A retry re-runs the handshake against current remote state, so it
      # only fails again if it loses the SAME race a second (or third) time.
      #
      # `{plugin}#latest` is one shared, mutable ref every session in the org
      # fetches -- not a per-branch target -- so only master may move it; a
      # feature-branch push still builds and tests, it just never publishes.
      - name: Publish orphan tag
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: wow-look-at-my/actions@orphan-release#latest
        with:
          source: ${{ steps.release.outputs.source_dir }}
          name: ${{ matrix.plugin }}
          version: ${{ steps.release.outputs.version }}
          message: ${{ steps.release.outputs.message }}

      - name: Publish orphan tag (retry 1)
        id: publish_retry1
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.publish.outcome == 'failure'
        continue-on-error: true
        uses: wow-look-at-my/actions@orphan-release#latest
        with:
          source: ${{ steps.release.outputs.source_dir }}
          name: ${{ matrix.plugin }}
          version: ${{ steps.release.outputs.version }}
          message: ${{ steps.release.outputs.message }}

      # No continue-on-error: a third loss in a row is treated as a real
      # failure, not more races -- fail loud rather than retry forever.
      - name: Publish orphan tag (retry 2)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.publish.outcome == 'failure' &&
          steps.publish_retry1.outcome == 'failure'
        uses: wow-look-at-my/actions@orphan-release#latest
        with:
          source: ${{ steps.release.outputs.source_dir }}
          name: ${{ matrix.plugin }}
          version: ${{ steps.release.outputs.version }}
          message: ${{ steps.release.outputs.message }}

      # Hand the cooked tree to publish-marketplace under a stable path: it is
      # what update-marketplace reads manifest.json out of, and the cook dir's
      # own name is a random mkdtemp suffix.
      - name: Stage the cooked tree
        run: |
          rm -rf "/tmp/packaged-${{ matrix.plugin }}"
          cp -r "${{ steps.release.outputs.source_dir }}" "/tmp/packaged-${{ matrix.plugin }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.plugin }}
          path: /tmp/packaged-${{ matrix.plugin }}
          retention-days: 1

      - name: Save plugin cache
        uses: actions/cache/save@v6
        with:
          path: /tmp/packaged-${{ matrix.plugin }}
          key: plugin-${{ matrix.plugin }}-${{ steps.hash.outputs.value }}

  publish-marketplace:
    needs: [prepare, build]
    if: >-
      github.event_name == 'push' &&
      needs.prepare.outputs.all_plugins != '[]' &&
      needs.prepare.outputs.all_plugins != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same reason as prepare: setup-marketplace-build can run go-toolchain here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-marketplace-build

      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packaged-*
          path: /tmp/all-plugin-artifacts

      - name: Prepare combined input
        env:
          ALL_PLUGINS: ${{ needs.prepare.outputs.all_plugins }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/combined-plugins
          for d in /tmp/all-plugin-artifacts/packaged-*/; do
            plugin=$(basename "$d" | sed 's/^packaged-//')
            cp -r "$d" "/tmp/combined-plugins/$plugin"
          done

          # marketplace.json's plugins array is REPLACED from this input, so a
          # plugin missing here silently vanishes from the marketplace -- users
          # can no longer install it and every check stays green. Fail instead.
          # (prepare's build/cached split looks for a cache key that never
          # matches the one `Save plugin cache` writes, so every plugin is
          # rebuilt every run today; this is what catches the day that changes.)
          missing=""
          for plugin in $(echo "$ALL_PLUGINS" | jq -r '.[]'); do
            [ -d "/tmp/combined-plugins/$plugin" ] || missing="$missing $plugin"
          done
          if [ -n "$missing" ]; then
            echo "::error::no cooked tree for:$missing -- publishing would drop them from marketplace.json"
            exit 1
          fi

      - name: Update marketplace.json
        id: marketplace
        run: marketplace-build update-marketplace --input /tmp/combined-plugins >> $GITHUB_OUTPUT

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          cp "${{ steps.marketplace.outputs.source_dir }}/marketplace.json" /tmp/site/
          cp site/index.html /tmp/site/

      - name: Publish marketplace site to buildhost
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH="${REF//\//-}"
          # buildhost dispatches each service by Host subdomain, so static
          # sites live at sites.<domain>/<project>/branch/<branch> (not a
          # /sites/ path on the apex). The OIDC audience is the buildhost
          # instance identity (apex domain).
          AUDIENCE="https://pazer.build"
          SITE_URL="https://sites.pazer.build/cc-marketplace/branch/${BRANCH}"

          # Mint a GitHub Actions OIDC token scoped to buildhost -- no static
          # secret. The cc-marketplace repo's token auto-provisions the public
          # cc-marketplace project on first upload.
          TOKEN=$(curl -sS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "Failed to obtain OIDC token" >&2
            exit 1
          fi

          tar -czf /tmp/site.tar.gz -C /tmp/site .

          # Upload, retrying transient 5xx with exponential backoff.
          for attempt in 1 2 3 4; do
            STATUS=$(curl -sS -o /tmp/site-resp.json -w '%{http_code}' \
              -X PUT "${SITE_URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/gzip" \
              -H "X-Git-Commit: ${SHA}" \
              --data-binary @/tmp/site.tar.gz) || true
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "Published site to ${SITE_URL}/"
              cat /tmp/site-resp.json; echo
              exit 0
            fi
            echo "Upload attempt ${attempt} failed: HTTP ${STATUS}" >&2
            cat /tmp/site-resp.json >&2 2>/dev/null || true
            echo >&2
            if [ "${STATUS}" -lt 500 ]; then
              exit 1
            fi
            sleep $((2 ** attempt))
          done
          echo "Giving up after 4 attempts" >&2
          exit 1

  # End-to-end smoke test: drive real Claude Code against the marketplace we
  # just published and actually install + update every plugin. This is the only
  # job that exercises the install path users take (the demo workflow loads a
  # local --plugin-dir, and the build job only runs `claude plugin validate` on
  # a cooked dir). Every entry now names a git ref, so this is what proves each
  # orphan tag was really pushed and really holds an installable plugin -- a tag
  # the build job failed to push is a 404 here rather than in production.
  smoke-test:
    needs: [publish-marketplace]
    if: ${{ github.event_name == 'push' && needs.publish-marketplace.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-claude-code

      - name: Install and update every plugin via Claude Code
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // installs every plugin from the marketplace this run published; each entry points at an orphan tag this run pushed, so a tag that was never pushed -- or holds the wrong tree -- fails here instead of for the first user who installs it
            const branch = (env.GITHUB_REF_NAME ?? "").split("/").join("-");
            const runNumber = env.GITHUB_RUN_NUMBER ?? "";
            const mktUrl = `https://sites.pazer.build/cc-marketplace/branch/${branch}/marketplace.json`;

            // -L is load-bearing: buildhost redirects /branch/<b>/ to /@<b>/; without it curl returns the redirect body, which parses as no version and never converges
            async function fetchJson(url: string): Promise<any> {
              const r = await exec.getExecOutput("curl", ["-fsSL", "-m", "25", url], { silent: true, ignoreReturnCode: true });
              if (r.exitCode !== 0) return null;
              try { return JSON.parse(r.stdout); } catch { return null; }
            }

            // nothing here makes cloning work over SSH, deliberately -- a published plugin must install for someone with no GitHub account, so SSH is forced to fail rather than let a runner with a key silently mask a source that requires one
            await $`git config --global core.sshCommand ${'false'}`;
            // waits for the marketplace this run published (metadata.version mirrors the run number, see update_marketplace.go) to go live on buildhost
            let mkt: any = null;
            for (let attempt = 1; attempt <= 30; attempt++) {
              const j = await fetchJson(mktUrl);
              const ver = j?.metadata?.version;
              if (j && String(ver) === runNumber) { mkt = j; core.info(`marketplace v${runNumber} is live`); break; }
              core.info(`waiting for marketplace v${runNumber} (saw '${ver ?? "none"}')... attempt ${attempt}`);
              await new Promise<void>((res) => setTimeout(() => res(), 5000));
            }
            if (!mkt) throw new Error(`marketplace did not reach v${runNumber} at ${mktUrl}`);

            // every published source must be anonymously cloneable; the install below would also catch a regression, but only as a confusing clone failure -- this names it explicitly
            const bad = (mkt.plugins ?? [])
              .map((pl: any) => [pl.name, pl.source] as const)
              .filter(([, s]: any) => !s || s.source !== 'url' || typeof s.url !== 'string' || !s.url.startsWith('https://'));
            if (bad.length > 0) {
              throw new Error(
                `these plugins are not installable without a GitHub account: ` +
                  bad.map(([n, s]: any) => `${n} -> ${JSON.stringify(s)}`).join(', ') +
                  ` (a 'github' source clones over ssh; publish 'url' with an https:// URL)`,
              );
            }
            core.info(`OK: all ${mkt.plugins.length} sources are anonymous https clones`);

            const mktName: string = mkt.name;
            const plugins: string[] = (mkt.plugins ?? []).map((p: any) => String(p.name));
            core.info(`Marketplace '${mktName}' lists ${plugins.length} plugins: ${plugins.join(" ")}`);
            if (plugins.length === 0) throw new Error("published marketplace lists no plugins");

            await $`claude plugin marketplace add ${mktUrl}`;

            // Install every plugin: each one shallow-clones its own orphan tag.
            for (const p of plugins) {
              core.startGroup(`install ${p}`);
              await $`claude plugin install ${`${p}@${mktName}`}`;
              core.endGroup();
            }

            // Update every plugin -- the path that 404'd in production.
            for (const p of plugins) {
              core.startGroup(`update ${p}`);
              await $`claude plugin update ${`${p}@${mktName}`}`;
              core.endGroup();
            }

            await $`claude plugin list`;

            // every entry must name a git ref this run pushed: "url" (an explicit https:// URL, no SSH) is what update-marketplace emits; "github" would mean it regressed to the SSH-cloning shape that fails on a runner with no key
            const wrong = (mkt.plugins ?? []).filter((p: any) => p?.source?.source !== "url" || !p?.source?.ref);
            if (wrong.length > 0) {
              throw new Error(`not a url git source: ${wrong.map((p: any) => p.name).join(" ")}`);
            }
            core.info(`OK: every plugin installed and updated from its orphan tag`);
