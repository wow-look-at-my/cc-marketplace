name: Release Plugins

on:
  push:
    # Every branch, no tag: this workflow pushes a plugin/*/v* tag per release, which must not re-enter it.
    branches: ["**"]
  workflow_dispatch:

# Per ref: only master publishes `<plugin>#latest` now, and one shared group cancels the older PENDING run, which reads as a failed build.
concurrency: {group: 'release-${{ github.ref }}'}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # see docs/ci-yaml-notes.md#composite-action-caller-permissions
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    outputs:
      all_plugins: ${{ steps.matrix.outputs.plugins }}
      build_plugins: ${{ steps.split.outputs.build_plugins }}
      cached_plugins: ${{ steps.split.outputs.cached_plugins }}
      slopfix_version: ${{ steps.slopfix.outputs.version }}
      has_build: ${{ steps.split.outputs.has_build }}
    steps:
      - uses: actions/checkout@v7

      - uses: wow-look-at-my/actions@common-checks#latest

      - uses: ./.github/actions/setup-marketplace-build

      # tsconfig.json covers .github/scripts; nothing ran it, so it had drifted to failing on every file.
      - name: Typecheck scripts
        run: npx tsc --noEmit

      # Here, not in the plugin matrix: these cover the scripts, and a skipped check can never go red.
      - name: Script tests
        run: npx tsx --test ".github/scripts/**/*.test.ts"

      # The slopfix plugin fetches its binary at build time and commits no copy, so the cache key carries buildhost's published version rather than slopfix's master head: the head moves at merge and buildhost publishes later, so keying on the head rebuilds against a binary that does not exist yet and the vendor script's probes fail the run.
      - name: Resolve the published slopfix version
        id: slopfix
        run: |
          set -eu
          location=$(curl -fsSI --connect-timeout 30 "https://dl.pazer.build/slopfix?os=linux&arch=amd64" | tr -d '\r' | grep -i '^location:')
          version=${location##*v=}
          if [ -z "$version" ] || [ "$version" = "$location" ]; then
            echo "buildhost named no version in: ${location}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: matrix
        run: marketplace-build prepare-matrix >> $GITHUB_OUTPUT

      - name: Check plugin caches
        id: split
        if: steps.matrix.outputs.has_changes == 'true'
        uses: wow-look-at-my/actions@typescript#latest
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ github.workspace }}/node_modules
          CACHE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || format('refs/heads/{0}', github.ref_name) }}
        with:
          steps: ${{ toJSON(steps) }}
          script: |
            const { hashFiles } = require('@actions/glob');
            const plugins: string[] = JSON.parse(steps.matrix.outputs.plugins);
            const repo = process.env.GITHUB_REPOSITORY;
            const ref = process.env.CACHE_REF;

            const buildPlugins: string[] = [];
            const cachedPlugins: string[] = [];
            // shellwalk is compiled into no-work-loss and enhanced-auto-allow through a local replace, so a change there must rebuild them.
            const toolHash = await hashFiles('tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod', 'tools/shellwalk/**/*.go', 'tools/shellwalk/go.mod');

            // These fetch slopfix at build time and commit no copy of it, so nothing under their own directories changes when buildhost publishes a new one.
            const slopfix = steps.slopfix.outputs.version;
            const upstream: Record<string, string> = {
              'slopfix': slopfix,
            };

            for (const plugin of plugins) {
              const hash = await hashFiles(`plugins/${plugin}/**`);
              const key = `plugin-${plugin}-${hash}-${toolHash}${upstream[plugin] ? `-${upstream[plugin]}` : ''}`;

              let cached = false;
              try {
                const out = child_process.execSync(
                  `gh api "repos/${repo}/actions/caches?key=${encodeURIComponent(key)}&ref=${encodeURIComponent(ref!)}" --jq ".actions_caches | length"`,
                  { encoding: 'utf8' },
                ).trim();
                cached = parseInt(out, 10) > 0;
              } catch {
                cached = false;
              }

              if (cached) {
                cachedPlugins.push(plugin);
                core.info(`${plugin}: cached`);
              } else {
                buildPlugins.push(plugin);
                core.info(`${plugin}: needs build`);
              }
            }

            core.setOutput('build_plugins', JSON.stringify(buildPlugins));
            core.setOutput('cached_plugins', JSON.stringify(cachedPlugins));
            core.setOutput('has_build', String(buildPlugins.length > 0));


  # The plugins that embed shellwalk compile it but never run its own suite, and a shared parser nothing tests is where the drift goes next.
  shellwalk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      # see docs/ci-yaml-notes.md#go-toolchain-permission-grants
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      # mvdan.cc/sh runs stringer when the fetch completes it, and a missing generator fails the build.
      - name: Install the generators a dependency's directives need
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/stringer@v0.49.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: tools/shellwalk

  build:
    needs: prepare
    if: needs.prepare.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      # see docs/ci-yaml-notes.md#go-toolchain-permission-grants
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.build_plugins) }}
    # The shared resource is one moving tag, `<plugin>#latest`, which every branch force-pushes. Keying the group to the plugin serialises exactly that, so two branches releasing different plugins still run at once.
    concurrency:
      group: release-tag-${{ matrix.plugin }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Compute plugin hash
        id: hash
        # Must match the key prepare computes, shellwalk included, or a cached hit is checked against one hash and saved under another.
        run: echo "value=${{ hashFiles(format('plugins/{0}/**', matrix.plugin), 'tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod', 'tools/shellwalk/**/*.go', 'tools/shellwalk/go.mod') }}${{ contains(fromJSON('["slopfix"]'), matrix.plugin) && format('-{0}', needs.prepare.outputs.slopfix_version) || '' }}" >> $GITHUB_OUTPUT

      # A dependency runs its own generators when the fetch completes it, and a missing one fails the build.
      - name: Install the generators a dependency's directives need
        if: ${{ hashFiles(format('plugins/{0}/**/*.go', matrix.plugin)) != '' }}
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/stringer@v0.49.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # see docs/ci-yaml-notes.md#release-build-binary-format-and-action-pin
      - name: Build Go plugin
        if: ${{ hashFiles(format('plugins/{0}/**/*.go', matrix.plugin)) != '' }}
        uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: plugins/${{ matrix.plugin }}
          targets: cosmo

      - uses: ./.github/actions/setup-marketplace-build

      # GITHUB_TOKEN: the docs plugin's prebuild re-vendors the Docker reference, and 60 anonymous requests an hour is not enough.
      - name: Build
        run: npx tsx .github/scripts/build-plugin.ts ${{ matrix.plugin }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        run: npx tsx .github/scripts/test-plugin.ts ${{ matrix.plugin }}

      - name: Cook plugin
        id: release
        run: marketplace-build release-plugin ${{ matrix.plugin }} >> $GITHUB_OUTPUT

      - uses: ./.github/actions/setup-claude-code

      - name: Validate Plugin
        run: claude plugin validate ${{ steps.release.outputs.source_dir }}

      # The cooked dir is published as-is; version comes from release-plugin (not auto-increment) so the tag and manifest agree.
      - name: Publish orphan tag
        if: github.event_name == 'push'
        uses: wow-look-at-my/actions@orphan-release#latest
        with:
          source: ${{ steps.release.outputs.source_dir }}
          name: ${{ matrix.plugin }}
          version: ${{ steps.release.outputs.version }}
          message: ${{ steps.release.outputs.message }}

      # Stable path for publish-marketplace: update-marketplace reads manifest.json from here, not the cook dir's random mkdtemp name.
      - name: Stage the cooked tree
        run: |
          rm -rf "/tmp/packaged-${{ matrix.plugin }}"
          cp -r "${{ steps.release.outputs.source_dir }}" "/tmp/packaged-${{ matrix.plugin }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.plugin }}
          path: /tmp/packaged-${{ matrix.plugin }}
          retention-days: 1

      - name: Save plugin cache
        uses: actions/cache/save@v6
        with:
          path: /tmp/packaged-${{ matrix.plugin }}
          key: plugin-${{ matrix.plugin }}-${{ steps.hash.outputs.value }}

  # see docs/ci-yaml-notes.md#css-duplication-lsp-job
  css-duplication-lsp:
    needs: [prepare, build]
    # build is skipped when no plugin changed. The cooked tree is still in the cache then.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compute plugin hash
        id: hash
        # The build job's key for this plugin, so the restore below finds the tree that job cooked.
        run: echo "value=${{ hashFiles('plugins/css-duplication/**', 'tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod', 'tools/shellwalk/**/*.go', 'tools/shellwalk/go.mod') }}" >> $GITHUB_OUTPUT

      # The release's own cooked tree, never a second build. A second build publishes a second release.
      - name: Restore the plugin the build job cooked
        uses: actions/cache/restore@v6
        with:
          path: /tmp/packaged-css-duplication
          key: plugin-css-duplication-${{ steps.hash.outputs.value }}
          fail-on-cache-miss: true

      - uses: ./.github/actions/setup-claude-code

      - name: Run Claude Code with the plugin loaded
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_WOW }}
          LSP_DEBUG_LOG: ${{ runner.temp }}/lsp-debug.log
          PLUGIN_DIR: /tmp/packaged-css-duplication
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const pluginDir = process.env.PLUGIN_DIR!;

            // the fixture starts already duplicated; the edit below adds one more copy, triggering didChange/didSave and the server's diagnostics
            const work = path.join(process.env.RUNNER_TEMP!, "lsp-e2e");
            fs.mkdirSync(work, { recursive: true });
            fs.writeFileSync(path.join(work, "style.css"),
              ".crumbs a { color: #2f81f7; text-decoration: none; }\n" +
              ".footer a { color: #2f81f7; text-decoration: none; }\n" +
              ".badge { border-radius: 999px; }\n");

            // Diagnostics drain into an attachment on a LATER turn, and one turn is not enough: the model issued the edit and the follow-up read in ONE batch, so the single drain that covered both ran 15ms before the server published, and nothing drained again. The ticket names the file holding the nonce, so its target cannot be known until it has been read, and the chain costs two sequential turns whatever the model would rather batch. Those turns only help when they come AFTER the edit, which is why the prompt numbers its steps: a run that read both files first and edited last published its diagnostics with nothing left to drain them.
            const nonce: string = require("crypto").randomUUID();
            fs.writeFileSync(path.join(work, "pointer.txt"), `${nonce}\n`);
            fs.writeFileSync(path.join(work, "ticket.txt"), "pointer.txt\n");

            // --model sonnet: this asserts a SERVER's behavior, unaffected by model tier, and runs on every push
            const res = await exec.getExecOutput("claude", [
              "-p", "Do these steps in this order, and do not start a later step until the earlier one is done. STEP 1: edit style.css to add a rule for selector .nav a with color #2f81f7 and no text-decoration. Do nothing else in that step. STEP 2: read ticket.txt, which contains the name of another file. STEP 3: read that other file, and reply with the exact line IT contains.",
              "--model", "sonnet",
              "--plugin-dir", pluginDir,
              "--allowedTools", "Read,Edit,Write",
              "--permission-mode", "bypassPermissions",
              "--debug", "lsp",
              "--debug-file", process.env.LSP_DEBUG_LOG!,
            ], { cwd: work, ignoreReturnCode: true });
            core.info(`claude exited ${res.exitCode}`);
            core.info(res.stdout.slice(0, 2000));

            // Without the nonce in the answer the run never walked the chain, and the assertion below would blame the server for a prompt the model declined
            if (!res.stdout.includes(nonce)) core.setFailed(`the run never followed ticket.txt to pointer.txt, so no turn followed the edit (expected ${nonce} in the answer)`);

      - name: Assert the server started, delivered diagnostics, and shut down clean
        env:
          LSP_DEBUG_LOG: ${{ runner.temp }}/lsp-debug.log
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const log = fs.readFileSync(process.env.LSP_DEBUG_LOG!, "utf-8");
            core.startGroup("LSP debug lines");
            core.info(log.split("\n").filter((l) => /lsp|diagnostic/i.test(l)).join("\n").slice(0, 8000));
            core.endGroup();

            const failures: string[] = [];
            const must: Array<[string, RegExp]> = [
              ["the plugin's .lsp.json was loaded", /Loaded 1 LSP server\(s\) from plugin: css-duplication/],
              ["the server process started", /Starting LSP server instance: plugin:css-duplication/],
              ["the initialize handshake completed", /LSP server plugin:css-duplication.* initialized/],
              ["the server published diagnostics", /Received diagnostics from plugin:css-duplication[^\n]*: [1-9]\d* diagnostic\(s\)/],
              ["the diagnostics were registered for delivery", /Registered [1-9]\d* diagnostic file\(s\) from plugin:css-duplication/],
              ["the diagnostics reached the model", /Returning [1-9]\d* diagnostic attachment\(s\)/],
            ];
            for (const [what, re] of must) {
              if (!re.test(log)) failures.push(`MISSING: ${what} (/${re.source}/)`);
            }
            // A registration with no drain after it means the edit was the LAST thing the run did, so no turn followed it. That is a prompt-ordering failure, not a server one, and saying so stops the next reader debugging the wrong half.
            const registeredAt = log.lastIndexOf("diagnostic file(s) from plugin:css-duplication");
            const drainedAt = log.lastIndexOf("Returning ");
            if (registeredAt >= 0 && drainedAt < registeredAt) {
              failures.push("the edit was the run's LAST action, so no turn followed it to drain the diagnostics: the steps ran out of order");
            }

            // the bug this job guards: a response with neither `result` nor `error` is malformed JSON-RPC, and only a real client rejects it
            const mustNot: Array<[string, RegExp]> = [
              ["the LSP session failed to stop", /Failed to stop LSP server|stop failed/],
              ["the server crashed", /LSP server .*css-duplication.* (crashed|exited unexpectedly)/],
            ];
            for (const [what, re] of mustNot) {
              const m = log.match(re);
              if (m) failures.push(`UNEXPECTED: ${what} -- ${m[0]}`);
            }

            if (failures.length > 0) {
              core.setFailed(`css-duplication LSP e2e failed:\n${failures.join("\n")}`);
            } else {
              core.info("OK: server started, published diagnostics, delivered them, and shut down cleanly");
            }

  publish-marketplace:
    needs: [prepare, build]
    if: >-
      github.event_name == 'push' &&
      needs.prepare.outputs.all_plugins != '[]' &&
      needs.prepare.outputs.all_plugins != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same reason as prepare: setup-marketplace-build can run go-toolchain here.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-marketplace-build

      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packaged-*
          path: /tmp/all-plugin-artifacts

      - name: Prepare combined input
        env:
          ALL_PLUGINS: ${{ needs.prepare.outputs.all_plugins }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/combined-plugins
          for d in /tmp/all-plugin-artifacts/packaged-*/; do
            plugin=$(basename "$d" | sed 's/^packaged-//')
            cp -r "$d" "/tmp/combined-plugins/$plugin"
          done

          # see docs/ci-yaml-notes.md#marketplace-json-replacement-and-a-stale-cache-key
          missing=""
          for plugin in $(echo "$ALL_PLUGINS" | jq -r '.[]'); do
            [ -d "/tmp/combined-plugins/$plugin" ] || missing="$missing $plugin"
          done
          if [ -n "$missing" ]; then
            echo "::error::no cooked tree for:$missing -- publishing would drop them from marketplace.json"
            exit 1
          fi

      - name: Update marketplace.json
        id: marketplace
        run: marketplace-build update-marketplace --input /tmp/combined-plugins >> $GITHUB_OUTPUT

      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          cp "${{ steps.marketplace.outputs.source_dir }}/marketplace.json" /tmp/site/
          cp site/index.html /tmp/site/

      - name: Publish marketplace site to buildhost
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH="${REF//\//-}"
          # buildhost routes by Host subdomain -- sites live at sites.<domain>/... not /sites/ on the apex; OIDC audience is the apex domain identity.
          AUDIENCE="https://pazer.build"
          SITE_URL="https://sites.pazer.build/cc-marketplace/branch/${BRANCH}"

          # Mint an OIDC token scoped to buildhost, no static secret -- it auto-provisions the public cc-marketplace project on first upload.
          TOKEN=$(curl -sS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "Failed to obtain OIDC token" >&2
            exit 1
          fi

          tar -czf /tmp/site.tar.gz -C /tmp/site .

          # Upload, retrying transient 5xx with exponential backoff.
          for attempt in 1 2 3 4; do
            STATUS=$(curl -sS -o /tmp/site-resp.json -w '%{http_code}' \
              -X PUT "${SITE_URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/gzip" \
              -H "X-Git-Commit: ${SHA}" \
              --data-binary @/tmp/site.tar.gz) || true
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "Published site to ${SITE_URL}/"
              cat /tmp/site-resp.json; echo
              exit 0
            fi
            echo "Upload attempt ${attempt} failed: HTTP ${STATUS}" >&2
            cat /tmp/site-resp.json >&2 2>/dev/null || true
            echo >&2
            if [ "${STATUS}" -lt 500 ]; then
              exit 1
            fi
            sleep $((2 ** attempt))
          done
          echo "Giving up after 4 attempts" >&2
          exit 1

  # see docs/ci-yaml-notes.md#smoke-test-job-rationale
  smoke-test:
    needs: [publish-marketplace]
    if: ${{ github.event_name == 'push' && needs.publish-marketplace.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-claude-code

      - name: Install and update every plugin via Claude Code
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            // installs every plugin from the marketplace this run published; each entry points at an orphan tag this run pushed, so a tag that was never pushed -- or holds the wrong tree -- fails here instead of for the first user who installs it
            const branch = (env.GITHUB_REF_NAME ?? "").split("/").join("-");
            const runNumber = env.GITHUB_RUN_NUMBER ?? "";
            const mktUrl = `https://sites.pazer.build/cc-marketplace/branch/${branch}/marketplace.json`;

            // -L is load-bearing: buildhost redirects /branch/<b>/ to /@<b>/; without it curl returns the redirect body, which parses as no version and never converges
            async function fetchJson(url: string): Promise<any> {
              const r = await exec.getExecOutput("curl", ["-fsSL", "-m", "25", url], { silent: true, ignoreReturnCode: true });
              if (r.exitCode !== 0) return null;
              try { return JSON.parse(r.stdout); } catch { return null; }
            }

            // nothing here makes cloning work over SSH, deliberately -- a published plugin must install for someone with no GitHub account, so SSH is forced to fail rather than let a runner with a key silently mask a source that requires one
            await $`git config --global core.sshCommand ${'false'}`;
            // waits for the marketplace this run published (metadata.version mirrors the run number, see update_marketplace.go) to go live on buildhost
            let mkt: any = null;
            for (let attempt = 1; attempt <= 30; attempt++) {
              const j = await fetchJson(mktUrl);
              const ver = j?.metadata?.version;
              if (j && String(ver) === runNumber) { mkt = j; core.info(`marketplace v${runNumber} is live`); break; }
              core.info(`waiting for marketplace v${runNumber} (saw '${ver ?? "none"}')... attempt ${attempt}`);
              await new Promise<void>((res) => setTimeout(() => res(), 5000));
            }
            if (!mkt) throw new Error(`marketplace did not reach v${runNumber} at ${mktUrl}`);

            // every published source must be anonymously cloneable; the install below would also catch a regression, but only as a confusing clone failure -- this names it explicitly
            const bad = (mkt.plugins ?? [])
              .map((pl: any) => [pl.name, pl.source] as const)
              .filter(([, s]: any) => !s || s.source !== 'url' || typeof s.url !== 'string' || !s.url.startsWith('https://'));
            if (bad.length > 0) {
              throw new Error(
                `these plugins are not installable without a GitHub account: ` +
                  bad.map(([n, s]: any) => `${n} -> ${JSON.stringify(s)}`).join(', ') +
                  ` (a 'github' source clones over ssh; publish 'url' with an https:// URL)`,
              );
            }
            core.info(`OK: all ${mkt.plugins.length} sources are anonymous https clones`);

            const mktName: string = mkt.name;
            const plugins: string[] = (mkt.plugins ?? []).map((p: any) => String(p.name));
            core.info(`Marketplace '${mktName}' lists ${plugins.length} plugins: ${plugins.join(" ")}`);
            if (plugins.length === 0) throw new Error("published marketplace lists no plugins");

            await $`claude plugin marketplace add ${mktUrl}`;

            // Install every plugin: each one shallow-clones its own orphan tag.
            for (const p of plugins) {
              core.startGroup(`install ${p}`);
              await $`claude plugin install ${`${p}@${mktName}`}`;
              core.endGroup();
            }

            // Update every plugin -- the path that 404'd in production.
            for (const p of plugins) {
              core.startGroup(`update ${p}`);
              await $`claude plugin update ${`${p}@${mktName}`}`;
              core.endGroup();
            }

            await $`claude plugin list`;

            // every entry must name a git ref this run pushed: "url" (an explicit https:// URL, no SSH) is what update-marketplace emits; "github" would mean it regressed to the SSH-cloning shape that fails on a runner with no key
            const wrong = (mkt.plugins ?? []).filter((p: any) => p?.source?.source !== "url" || !p?.source?.ref);
            if (wrong.length > 0) {
              throw new Error(`not a url git source: ${wrong.map((p: any) => p.name).join(" ")}`);
            }
            core.info(`OK: every plugin installed and updated from its orphan tag`);
