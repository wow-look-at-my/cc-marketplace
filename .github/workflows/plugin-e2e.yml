name: plugin e2e

on:
  push:
    # Every branch, no tag: the plugin/*/v* tags the release workflow pushes must not start this one.
    branches: ["**"]

permissions:
  id-token: write
  contents: read

jobs:
  # The Bash cleaner's rule moved to slopfix, so this drives the manifest against the real binary, which no unit test covers.
  slopfix-clean-bash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Against the slopfix this branch is written for, not the published one: a check that has not shipped yet would otherwise fail here for the whole time between the two merges.
      - name: Check out the slopfix this branch expects
        uses: actions/checkout@v7
        with:
          repository: wow-look-at-my/slopfix
          ref: ${{ github.ref_name }}
          path: .slopfix-src
        continue-on-error: true

      # A branch of that name may not exist, and master is then what this plugin ships against.
      - name: Fall back to slopfix master
        if: hashFiles('.slopfix-src/go.mod') == ''
        uses: actions/checkout@v7
        with:
          repository: wow-look-at-my/slopfix
          path: .slopfix-src

      # Every subcommand the manifest names has to EXIST, and slopfix's own source is what says so. Building it here instead would fail this job for a lint finding in another repository.
      - name: Every hook names a subcommand slopfix defines
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const root = "plugins/slopfix";
            const manifest = JSON.parse(fs.readFileSync(`${root}/.claude-plugin/plugin.json`, "utf-8"));

            const registered = new Set<string>();
            for (const entries of Object.values(manifest.hooks) as any[]) {
              for (const entry of entries) {
                for (const h of entry.hooks) {
                  const m = /slopfix\.ape\s+([a-z][a-z-]*)/.exec(h.command);
                  if (m) registered.add(m[1]);
                }
              }
            }
            if (registered.size === 0) core.setFailed("the manifest names no slopfix subcommand at all");

            // Every subcommand slopfix registers, read off its source. A script naming one that is not there reaches nothing at run time.
            const defined = new Set<string>();
            const cmdDir = ".slopfix-src/cmd";
            for (const f of fs.readdirSync(cmdDir)) {
              if (!f.endsWith(".go")) continue;
              const body = fs.readFileSync(path.join(cmdDir, f), "utf-8");
              for (const m of body.matchAll(/\bUse:\s*"([a-z][a-z-]*)/g)) defined.add(m[1]);
              for (const m of body.matchAll(/\bregister\(\s*"([a-z][a-z-]*)"/g)) defined.add(m[1]);
            }
            core.info(`slopfix defines: ${[...defined].sort().join(", ")}`);

            const failures: string[] = [];
            for (const name of [...registered].sort()) {
              if (defined.has(name)) core.info(`OK ${name}`);
              else failures.push(`the manifest names "${name}", which slopfix does not define`);
            }
            if (failures.length > 0) core.setFailed(`hooks that reach nothing:\n${failures.join("\n")}`);

  # see docs/ci-yaml-notes.md#css-duplication-lsp-job
  css-duplication-lsp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # see docs/ci-yaml-notes.md#go-toolchain-permission-grants
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the language server
        uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: plugins/css-duplication
          # Same build release.yml makes, because the cook below only stages a fat APE.
          targets: cosmo
          # Exists to be driven by the e2e below; autorelease off since a branch push should not publish it to buildhost.
          autorelease: 'false'

      - uses: ./.github/actions/setup-marketplace-build

      # The cook stages the launcher .lsp.json names beside the APE -- see docs/ci-yaml-notes.md#css-duplication-lsp-job
      - name: Cook the plugin the way a release does
        id: cook
        run: marketplace-build release-plugin css-duplication >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-claude-code

      - name: Run Claude Code with the plugin loaded
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_WOW }}
          LSP_DEBUG_LOG: ${{ runner.temp }}/lsp-debug.log
          PLUGIN_DIR: ${{ steps.cook.outputs.source_dir }}
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const pluginDir = process.env.PLUGIN_DIR!;

            // the fixture starts already duplicated; the edit below adds one more copy, triggering didChange/didSave and the server's diagnostics
            const work = path.join(process.env.RUNNER_TEMP!, "lsp-e2e");
            fs.mkdirSync(work, { recursive: true });
            fs.writeFileSync(path.join(work, "style.css"),
              ".crumbs a { color: #2f81f7; text-decoration: none; }\n" +
              ".footer a { color: #2f81f7; text-decoration: none; }\n" +
              ".badge { border-radius: 999px; }\n");

            // Diagnostics drain into an attachment on a LATER turn, and one turn is not enough: the model issued the edit and the follow-up read in ONE batch, so the single drain that covered both ran 15ms before the server published, and nothing drained again. The ticket names the file holding the nonce, so its target cannot be known until it has been read, and the chain costs two sequential turns whatever the model would rather batch. Those turns only help when they come AFTER the edit, which is why the prompt numbers its steps: a run that read both files first and edited last published its diagnostics with nothing left to drain them.
            const nonce: string = require("crypto").randomUUID();
            fs.writeFileSync(path.join(work, "pointer.txt"), `${nonce}\n`);
            fs.writeFileSync(path.join(work, "ticket.txt"), "pointer.txt\n");

            // --model sonnet: this asserts a SERVER's behavior, unaffected by model tier, and runs on every push
            const res = await exec.getExecOutput("claude", [
              "-p", "Do these steps in this order, and do not start a later step until the earlier one is done. STEP 1: edit style.css to add a rule for selector .nav a with color #2f81f7 and no text-decoration. Do nothing else in that step. STEP 2: read ticket.txt, which contains the name of another file. STEP 3: read that other file, and reply with the exact line IT contains.",
              "--model", "sonnet",
              "--plugin-dir", pluginDir,
              "--allowedTools", "Read,Edit,Write",
              "--permission-mode", "bypassPermissions",
              "--debug", "lsp",
              "--debug-file", process.env.LSP_DEBUG_LOG!,
            ], { cwd: work, ignoreReturnCode: true });
            core.info(`claude exited ${res.exitCode}`);
            core.info(res.stdout.slice(0, 2000));

            // Without the nonce in the answer the run never walked the chain, and the assertion below would blame the server for a prompt the model declined
            if (!res.stdout.includes(nonce)) core.setFailed(`the run never followed ticket.txt to pointer.txt, so no turn followed the edit (expected ${nonce} in the answer)`);

      - name: Assert the server started, delivered diagnostics, and shut down clean
        env:
          LSP_DEBUG_LOG: ${{ runner.temp }}/lsp-debug.log
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const log = fs.readFileSync(process.env.LSP_DEBUG_LOG!, "utf-8");
            core.startGroup("LSP debug lines");
            core.info(log.split("\n").filter((l) => /lsp|diagnostic/i.test(l)).join("\n").slice(0, 8000));
            core.endGroup();

            const failures: string[] = [];
            const must: Array<[string, RegExp]> = [
              ["the plugin's .lsp.json was loaded", /Loaded 1 LSP server\(s\) from plugin: css-duplication/],
              ["the server process started", /Starting LSP server instance: plugin:css-duplication/],
              ["the initialize handshake completed", /LSP server plugin:css-duplication.* initialized/],
              ["the server published diagnostics", /Received diagnostics from plugin:css-duplication[^\n]*: [1-9]\d* diagnostic\(s\)/],
              ["the diagnostics were registered for delivery", /Registered [1-9]\d* diagnostic file\(s\) from plugin:css-duplication/],
              ["the diagnostics reached the model", /Returning [1-9]\d* diagnostic attachment\(s\)/],
            ];
            for (const [what, re] of must) {
              if (!re.test(log)) failures.push(`MISSING: ${what} (/${re.source}/)`);
            }
            // A registration with no drain after it means the edit was the LAST thing the run did, so no turn followed it. That is a prompt-ordering failure, not a server one, and saying so stops the next reader debugging the wrong half.
            const registeredAt = log.lastIndexOf("diagnostic file(s) from plugin:css-duplication");
            const drainedAt = log.lastIndexOf("Returning ");
            if (registeredAt >= 0 && drainedAt < registeredAt) {
              failures.push("the edit was the run's LAST action, so no turn followed it to drain the diagnostics: the steps ran out of order");
            }

            // the bug this job guards: a response with neither `result` nor `error` is malformed JSON-RPC, and only a real client rejects it
            const mustNot: Array<[string, RegExp]> = [
              ["the LSP session failed to stop", /Failed to stop LSP server|stop failed/],
              ["the server crashed", /LSP server .*css-duplication.* (crashed|exited unexpectedly)/],
            ];
            for (const [what, re] of mustNot) {
              const m = log.match(re);
              if (m) failures.push(`UNEXPECTED: ${what} -- ${m[0]}`);
            }

            if (failures.length > 0) {
              core.setFailed(`css-duplication LSP e2e failed:\n${failures.join("\n")}`);
            } else {
              core.info("OK: server started, published diagnostics, delivered them, and shut down cleanly");
            }
