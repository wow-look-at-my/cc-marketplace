name: Refresh slopfix

# buildhost refuses a schedule-event OIDC token, so this run only dispatches release.yml, whose slopfix cache key rebuilds the plugin once a new binary is published.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            await octokit.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'master',
            });
            core.info('Dispatched release.yml on master');
