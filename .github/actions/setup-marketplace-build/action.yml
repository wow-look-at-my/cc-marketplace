name: Setup marketplace-build
description: Build or restore cached marketplace-build CLI

# Caller permissions: see docs/ci-yaml-notes.md#composite-action-caller-permissions

inputs:
  go-toolchain-installed:
    description: >-
      Set to 'true' by a caller that already ran wow-look-at-my/go-toolchain@v1
      in THIS job. That action hands its build outputs to a cache key of (run,
      job), so a second call in the same job loses the save to a 409 Conflict
      and fails the job. The CLI the first call installed builds the same thing
      with no hand-off, so this switches to it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install script dependencies
      shell: bash
      run: npm ci

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # https://github.com/extractions/setup-just/releases/tag/v4

    # go-toolchain writes build/<name>; naming a per-platform slot caches nothing and only breaks once the key misses.
    - uses: wow-look-at-my/actions@smart-cache#latest
      id: cache
      with:
        path: tools/marketplace-build/build/marketplace-build
        key: marketplace-build-${{ hashFiles('tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod', 'tools/marketplace-build/go.sum') }}

    - name: Check binary exists
      id: binary
      shell: bash
      run: |
        if [ -f tools/marketplace-build/build/marketplace-build ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: wow-look-at-my/go-toolchain@v1
      if: steps.binary.outputs.exists != 'true' && inputs.go-toolchain-installed != 'true'
      with:
        working-directory: "tools/marketplace-build"
        # An internal CI helper, not a release artifact.
        autorelease: "false"

    # Same build, via the CLI the caller's own go-toolchain step already put on PATH.
    - name: Build marketplace-build with the installed go-toolchain
      if: steps.binary.outputs.exists != 'true' && inputs.go-toolchain-installed == 'true'
      shell: bash
      working-directory: tools/marketplace-build
      run: go-toolchain

    - name: Install marketplace-build
      shell: bash
      run: |
        set -euo pipefail
        src="tools/marketplace-build/build/marketplace-build"
        if [ ! -f "$src" ]; then
          echo "::error::$src missing -- go-toolchain writes build/<name>, not a per-platform slot"
          ls -la tools/marketplace-build/build 2>&1 || true
          exit 1
        fi
        cp "$src" /usr/local/bin/marketplace-build
        marketplace-build --help >/dev/null
