name: Setup marketplace-build
description: Build or restore cached marketplace-build CLI

# CALLER PERMISSIONS -- a composite cannot request its own, so every job that
# uses this action must declare:
#
#   permissions:
#     id-token: write
#     contents: write   # go-toolchain submits the dependency graph; 403 without it
#     actions: read     # its no-all-builds guard scans the run's jobs...
#     checks: read      # ...and the head commit's check runs; both fail closed
#
# The go-toolchain step below runs only on a cache MISS, i.e. only when
# tools/marketplace-build changes -- so an incomplete set stays green for
# months and then fails the first build that touches the tool.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install script dependencies
      shell: bash
      run: npm ci

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # https://github.com/extractions/setup-just/releases/tag/v4

    - uses: wow-look-at-my/actions@smart-cache#latest
      id: cache
      with:
        path: tools/marketplace-build/build/marketplace-build_linux_amd64
        key: marketplace-build-${{ hashFiles('tools/marketplace-build/**/*.go', 'tools/marketplace-build/go.mod', 'tools/marketplace-build/go.sum') }}

    - name: Check binary exists
      id: binary
      shell: bash
      run: |
        if [ -f tools/marketplace-build/build/marketplace-build_linux_amd64 ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: wow-look-at-my/go-toolchain@v1
      if: steps.binary.outputs.exists != 'true'
      with:
        working-directory: "tools/marketplace-build"
        os: linux
        arch: amd64
        # An internal CI helper, not a release artifact.
        autorelease: "false"

    - name: Install marketplace-build
      shell: bash
      run: cp "tools/marketplace-build/build/marketplace-build_linux_amd64" "/usr/local/bin/marketplace-build"
